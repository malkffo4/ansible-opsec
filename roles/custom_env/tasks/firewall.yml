---
# Самодостаточный файл — не зависит от того, из какого плея импортирован.
#
# КРИТИЧНО: перед переключением sshd на новый порт нужно открыть В ФАЙРВОЛЕ
# И старый порт (на случай отката), И новый целевой порт (secret_ssh_port) —
# иначе ssh_hardening перевесит sshd на новый порт, а файрвол его не пустит,
# и рестарт sshd подвиснет намертво (именно так и случилось в проде).
#
# Форвардинг пакетов (нужен для VPN) настраивается НЕ здесь, а через
# настоящие переменные роли devsec.hardening.os_hardening — sysctl_overwrite
# и ufw_default_forward_policy в group_vars/servers.yml. Роль применяет
# ufw-дефолты ПОСЛЕ этого файла и перезаписала бы любую ручную правку
# /etc/default/ufw, поэтому здесь такой правки больше нет.

- name: Определить набор SSH-портов, которые точно должны остаться доступны (текущий + целевой)
  ansible.builtin.set_fact:
    ssh_ports_needed: >-
      {{
        [
          (current_ssh_port | default(ansible_port) | default(22)) | int,
          (secret_ssh_port | default(ansible_port) | default(22)) | int
        ] | unique
      }}
  when: "'servers' in group_names"

- name: Определить порты, которые сервис реально слушает наружу
  ansible.builtin.shell: |
    set -o pipefail
    ss -H -tulpn 2>/dev/null | awk '{print $1, $5}' \
      | grep -Ev '127\.0\.0\.1|::1' \
      | awk -F'[: ]' '{print $1, $NF}' \
      | sort -u
  args:
    executable: /bin/bash
  changed_when: false
  register: detected_listeners
  when: "'servers' in group_names"

- name: Показать, что было обнаружено
  ansible.builtin.debug:
    msg: "{{ detected_listeners.stdout_lines }}"
  when: "'servers' in group_names"

- name: Превратить обнаруженные строки "proto port" в список {port, proto}
  ansible.builtin.set_fact:
    detected_ports_parsed: "{{ detected_ports_parsed | default([]) + [{'proto': item.split(' ')[0], 'port': item.split(' ')[1] | int}] }}"
  loop: "{{ detected_listeners.stdout_lines | default([]) }}"
  when: "'servers' in group_names"

- name: Собрать итоговый список портов (SSH текущий+целевой + автообнаруженные + explicit из secrets.yml)
  ansible.builtin.set_fact:
    ports_to_open: >-
      {{
        (ssh_ports_needed | map('community.general.dict_kv', 'port') | map('combine', {'proto': 'tcp'}) | list)
        + (detected_ports_parsed | default([]))
        + (extra_allowed_ports | default([]))
      }}
  when: "'servers' in group_names"

- name: Показать итоговый список портов, которые реально откроются
  ansible.builtin.debug:
    msg: "{{ ports_to_open }}"
  when: "'servers' in group_names"

# --- Debian/Ubuntu: ufw ---
- name: "[ufw] Открыть порты"
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto }}"
  loop: "{{ ports_to_open }}"
  when: ansible_os_family == 'Debian' and 'servers' in group_names

- name: "[ufw] Старый SSH-порт (22) автоматически НЕ закрываем"
  ansible.builtin.debug:
    msg: >-
      Порт 22 остаётся открытым до тех пор, пока вы вручную не подтвердите
      новый доступ и не запустите плейбук с -e close_old_ssh_port=true
      (см. README, финальный шаг очистки).
  when: ansible_os_family == 'Debian' and 'servers' in group_names

- name: "[ufw] Закрыть старый порт 22, если подтверждено вручную"
  community.general.ufw:
    rule: deny
    port: "22"
    proto: tcp
  when:
    - ansible_os_family == 'Debian'
    - "'servers' in group_names"
    - close_old_ssh_port | default(false) | bool
    - (secret_ssh_port | default(22) | int) != 22

- name: "[ufw] Включить"
  community.general.ufw:
    state: enabled
    policy: deny
  when: ansible_os_family == 'Debian' and 'servers' in group_names

# --- RedHat/Fedora: firewalld (в основном для laptops) ---
- name: "[firewalld] Открыть порты"
  ansible.posix.firewalld:
    port: "{{ item.port }}/{{ item.proto }}"
    permanent: yes
    immediate: yes
    state: enabled
  loop: "{{ ports_to_open }}"
  when: ansible_os_family == 'RedHat' and 'servers' in group_names

- name: Предупреждение про Docker + ufw/firewalld
  ansible.builtin.debug:
    msg: >-
      Если Amnezia установлена через Docker — Docker сам управляет iptables
      для проброшенных портов и иногда конфликтует с ufw/firewalld.
      ОБЯЗАТЕЛЬНО проверьте подключение к VPN с телефона после этого
      прогона, не полагаясь только на "ufw status".
  when: "'servers' in group_names"
