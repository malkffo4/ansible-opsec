---
- name: Безопасное добавление параметров ядра через grubby
  ansible.builtin.shell: |
    if ! grubby --info=ALL | grep -q 'args=.*{{ item }}'; then
      grubby --update-kernel=ALL --args='{{ item }}'
      echo "changed"
    fi
  register: grubby_result
  changed_when: "'changed' in grubby_result.stdout"
  loop:
    - "slab_nomerge"
    - "init_on_alloc=1"
    - "init_on_free=1"
    - "page_alloc.shuffle=1"
    - "pti=on"
    - "randomize_kstack_offset=on"
  when: ansible_os_family == 'RedHat'