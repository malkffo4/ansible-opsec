---
- name: Set Windows Firewall to block inbound by default on Domain Profile
  community.windows.win_firewall:
    state: enabled
    profiles:
      - Domain
      - Private
      - Public

- name: Configure strict default policies for Firewall Profiles
  ansible.windows.win_powershell:
    script: |
      Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True -DefaultInboundAction Block
