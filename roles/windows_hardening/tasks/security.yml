---
- name: Disable AutoRun
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer
    name: NoDriveTypeAutoRun
    data: 255
    type: dword
    state: present

- name: Disable Windows Script Host (WSH)
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows Script Host\Settings
    name: Enabled
    data: 0
    type: dword
    state: present

- name: Block Macros in Office (Word, Excel, PowerPoint) via Trust Center (example for Office 16.0)
  ansible.windows.win_regedit:
    path: HKCU:\SOFTWARE\Policies\Microsoft\office\16.0\word\security
    name: vbamacrowarning
    data: 4
    type: dword
    state: present
  ignore_errors: yes

- name: Disable SMBv1
  ansible.windows.win_powershell:
    script: |
      Set-SmbServerConfiguration -EnableSMB1Protocol $false -Force
