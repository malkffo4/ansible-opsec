---
- name: Disable Windows Telemetry via Registry
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection
    name: AllowTelemetry
    data: 0
    type: dword
    state: present

- name: Disable and Stop DiagTrack service
  ansible.windows.win_service:
    name: DiagTrack
    state: stopped
    start_mode: disabled

- name: Disable and Stop dmwappushservice
  ansible.windows.win_service:
    name: dmwappushservice
    state: stopped
    start_mode: disabled
